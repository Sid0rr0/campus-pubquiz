- banner:
  - link "Campus Pub Quiz":
    - /url: /
  - navigation:
    - link "Guide"
    - link "Sessions"
    - link "Teams"
    - link "Stats"
    - link "Users"
    - button "Log out"
- main:
  - complementary:
    - heading "Quiz Master" [level=1]
    - text: /\d+:\d{2}/
    - paragraph: /Quiz:\s+Quiz night [0-9a-f]{6} [A-Z]+(-[A-Z]+){2}/
    - paragraph: "Status: break_intro"
    - paragraph: /Display:\s+R2Q1 \(B\)/
    - link "Open display"
    - button "Previous"
    - button "Advance"
    - button "Leaderboard"
    - button "Fullscreen media"
    - switch "Display sound" [checked]: "On"
    - button "Join overlay"
    - button "End Quiz"
    - text: Break ends at
    - textbox "Break ends at"
    - button "Set"
    - link "Edit quiz"
    - heading "Teams (2)" [level=2]
    - list:
      - listitem:
        - text: /Connected Team A [0-9a-f]{6}/
        - button "Kick"
      - listitem:
        - text: /Connected Team B [0-9a-f]{6}/
        - button "Kick"
  - heading "Grade Questions" [level=2]
  - img "Round 1"
  - navigation "Warm-up questions":
    - button "Show title card of Warm-up": T
    - button "Grade question 1 of Warm-up (not yet graded)"
    - button "Grade question 2 of Warm-up"
  - paragraph: Warm-up
  - img "Round 2"
  - navigation "Name that tune questions":
    - button "Show title card of Name that tune": T
    - button "Grade question 1 of Name that tune"
    - button "Show break after Name that tune (live on display)" [pressed]: B
  - paragraph: Name that tune
  - region "Break card":
    - heading "Break 1 (final)" [level=2]
  - heading "Teams" [level=2]
  - table:
    - rowgroup:
      - row "Position Team 1 2 Bonus Total Actions"
    - rowgroup:
      - row /Team A [0-9a-f]{6} 5 0 0 5 Actions for Team A [0-9a-f]{6}/
      - row /Team B [0-9a-f]{6} 0 0 0 0 Actions for Team B [0-9a-f]{6}/
