- banner:
  - navigation:
    - link "Guide"
    - link "Sessions"
    - link "Teams"
    - link "Stats"
    - link "Users"
    - button "Log out"
- main:
  - complementary:
    - heading "Quiz Master" [level=1]
    - paragraph: /Quiz:\s+Full night [0-9a-f]{6} [A-Z]+(-[A-Z]+){2}/
    - paragraph: "Status: locking"
    - paragraph: /Display:\s+R\dQ\d/
    - link "Open display"
    - button "Previous"
    - button "Advance"
    - button "Leaderboard"
    - button "Fullscreen media"
    - switch "Display sound" [checked]: "On"
    - button "Join overlay"
    - button "End Quiz"
    - text: Break ends at
    - textbox "Break ends at"
    - button "Set"
    - link "Edit quiz"
    - heading "Teams (2)" [level=2]
    - list:
      - listitem /Team A [0-9a-f]{6} has not answered yet/:
        - text: /Connected Team A [0-9a-f]{6}/
        - button "Kick"
      - listitem /Team B [0-9a-f]{6} has not answered yet/:
        - text: /Connected Team B [0-9a-f]{6}/
        - button "Kick"
  - heading "Grade Questions" [level=2]
  - navigation "Warm-up questions":
    - button /Grade question 1 of Warm-up/
    - button /Grade question 2 of Warm-up/
  - navigation "Name that tune questions":
    - button /Grade question 1 of Name that tune/
    - button /Grade question 2 of Name that tune \(live on display\)/
  - heading "Teams" [level=2]
  - table:
    - rowgroup:
      - row "Position Team 1 2 3 4 Bonus Total Actions"
