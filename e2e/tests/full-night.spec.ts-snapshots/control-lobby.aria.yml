- banner:
  - navigation:
    - link "Guide"
    - link "Sessions"
    - link "Teams"
    - link "Stats"
    - link "League"
    - link "My Team"
    - link "Manage leagues"
    - link "Users"
    - button "Log out"
- main:
  - complementary:
    - heading "Quiz Master" [level=1]
    - paragraph: /Quiz:\s+Full night [0-9a-f]{6} [A-Z]+(-[A-Z]+){2}/
    - paragraph: "Status: lobby"
    - paragraph: /Display:\s+R\dQ\d/
    - link "Open display"
    - button "Start Quiz"
    - button "Leaderboard"
    - button "Fullscreen media"
    - switch "Display sound" [checked]: "On"
    - button "End Quiz"
    - link "Edit quiz"
    - heading "Teams (2)" [level=2]
    - list:
      - listitem:
        - text: /Connected Team A [0-9a-f]{6}/
        - button "Kick"
      - listitem:
        - text: /Connected Team B [0-9a-f]{6}/
        - button "Kick"
  - heading "Session Settings" [level=2]
  - tablist:
    - tab "Settings" [selected]
    - tab "Power-ups"
  - tabpanel "Settings":
    - spinbutton "Lock round after (seconds)": "5"
    - checkbox "Autoplay media" [checked]
    - checkbox "Countdown sound" [checked]
    - checkbox "Show round overview after rules" [checked]
    - checkbox "Collect feedback" [checked]
    - checkbox "Fun facts on the break screen" [checked]
    - spinbutton "Max players per team": "6"
    - spinbutton "Extra player penalty (points)": "2"
    - list:
      - listitem:
        - textbox "Rule 1": No cheating.
        - button "Remove rule 1"
    - button "Add rule"
  - button "Save"
