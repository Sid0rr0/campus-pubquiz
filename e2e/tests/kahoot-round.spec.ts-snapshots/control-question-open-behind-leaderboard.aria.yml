- banner:
  - link "Campus Pub Quiz":
    - /url: /
  - navigation:
    - link "Guide"
    - link "Sessions"
    - link "Teams"
    - link "Stats"
    - link "Users"
    - button "Log out"
- main:
  - complementary:
    - heading "Quiz Master" [level=1]
    - paragraph: /Quiz:\s+Kahoot [0-9a-z]+ [A-Z]+(-[A-Z]+){2}/
    - paragraph: "Status: question_open"
    - paragraph: /Display:\s+R1Q2/
    - link "Open display"
    - button "Previous" [disabled]
    - button "Hide Leaderboard"
    - button "Leaderboard"
    - button "Fullscreen media"
    - switch "Display sound" [checked]: "On"
    - button "Join overlay"
    - button "End Quiz"
    - link "Edit quiz"
    - heading "Teams (2)" [level=2]
    - list:
      - listitem /Team A [0-9a-f]{6} has not answered yet/:
        - text: /Connected Team A [0-9a-f]{6}/
        - button "Kick"
      - listitem /Team B [0-9a-f]{6} has not answered yet/:
        - text: /Connected Team B [0-9a-f]{6}/
        - button "Kick"
  - heading "Grade Questions" [level=2]
  - img "Round 1"
  - navigation "Quick fire questions":
    - img "Quick fire title card": T
    - button "Grade question 1 of Quick fire"
    - button "Grade question 2 of Quick fire (live on display)" [pressed]
  - paragraph: Round 1 (Quick fire) — Q2 of 2
  - heading "Which ocean is the largest?" [level=2]
  - paragraph: "Correct answer: Pacific 0/2 answered 0 correct"
  - heading "Teams" [level=2]
  - table:
    - rowgroup:
      - row "Position Team 1 Bonus Total Actions"
    - rowgroup:
      - row /Team A [0-9a-f]{6} [\d.]+ 0 [\d.]+ Actions for Team A [0-9a-f]{6}/
      - row /Team B [0-9a-f]{6} 0 0 0 Actions for Team B [0-9a-f]{6}/
