- banner:
  - link "Campus Pub Quiz":
    - /url: /
  - navigation:
    - link "Guide"
    - link "Sessions"
    - link "Teams"
    - link "Stats"
    - link "Users"
    - button "Log out"
- main:
  - complementary:
    - heading "Quiz Master" [level=1]
    - paragraph: /Quiz:\s+Kahoot [0-9a-z]+ [A-Z]+(-[A-Z]+){2}/
    - paragraph: "Status: question_open"
    - paragraph: /Display:\s+R1Q1/
    - link "Open display"
    - button "Previous"
    - button "Advance"
    - button "Leaderboard"
    - button "Fullscreen media"
    - switch "Display sound" [checked]: "On"
    - button "Join overlay"
    - button "End Quiz"
    - link "Edit quiz"
    - heading "Teams (2)" [level=2]
    - list:
      - listitem /Team A [0-9a-f]{6} has answered/:
        - text: /Connected Team A [0-9a-f]{6}/
        - button "Kick"
      - listitem /Team B [0-9a-f]{6} has answered/:
        - text: /Connected Team B [0-9a-f]{6}/
        - button "Kick"
  - heading "Grade Questions" [level=2]
  - img "Round 1"
  - navigation "Quick fire questions":
    - button "Show title card of Quick fire": T
    - button "Grade question 1 of Quick fire (live on display)" [pressed]
    - button "Grade question 2 of Quick fire"
    - button "Show break after Quick fire": B
  - paragraph: Quick fire
  - region "Question detail":
    - paragraph: Round 1 (Quick fire) — Q1 of 2
    - heading "Which planet is known as the Red Planet?" [level=2]
    - paragraph: "Correct answer: Mars"
  - paragraph: 2/2 answered 1 correct
  - list:
    - listitem:
      - text: /Team A [0-9a-f]{6} Mars/
    - listitem:
      - text: /Team B [0-9a-f]{6} Venus/
  - heading "Teams" [level=2]
  - table:
    - rowgroup:
      - row "Position Team 1 Bonus Total Actions"
    - rowgroup:
      - row /Team A [0-9a-f]{6} [\d.]+ 0 [\d.]+ Actions for Team A [0-9a-f]{6}/
      - row /Team B [0-9a-f]{6} 0 0 0 Actions for Team B [0-9a-f]{6}/
