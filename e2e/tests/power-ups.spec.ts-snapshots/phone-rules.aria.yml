    - listitem: Want to contest something? Come with a credible source.
    - listitem: In case of no correct answers, the moderator CAN award a bonus point to the team with the funniest answer.
    - listitem:
      - text: "Shot bonus: Order shots, at minimum more than half your player count. Must be checked by a moderator to get the points. ("
      - strong: 1 point + 2 coins
      - text: ", doable twice per quiz)"
    - listitem:
      - text: "Selfie bonus: Snap a group photo or selfie with your whole team, post it as an Instagram story, and tag @esn.ctu and @isc_hub.cz. Must be checked by a moderator to get the points. ("
      - strong: 1 point + 2 coins
      - text: )
    - listitem:
      - text: "Power-ups are on: you start with"
      - strong: 2 coins
      - text: . If your team rated all rounds of the last pub quiz, you get 2 bonus coins. Earn more with shots and selfies.
